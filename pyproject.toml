[project]
name = "div-prune"
version = "0.1.0"
description = "Diversity-regularization-guided head pruning for multi-head attention models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # torch 2.9+ hits WinError 1114 (c10.dll) on Windows; pin below it
    "torch>=2.5,<2.9",
    "torch-geometric>=2.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.65",
    "matplotlib>=3.10.9",
    "sacrebleu>=2.4",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/divprune"]
